name: ccloco_muon_clip_7B_sweep
project:  ccloco7B
method: grid
program: train.py
command:
  - /usr/bin/env
  - torchrun
  - --nproc_per_node=8
  - ${program} 
  - ${args_no_boolean_flags}
  - --track_muon_rms
  - --track_qk_clip
  - --use_qk_clip 
  - --log_inner_steps
  - --inner_steps_per_log=1

parameters:
  # Run configuration
  strategy:
    value: ccloco_muon_clip
  run_name:
    value: ccloco_muon_clip_thresh30

  # Data configuration
  shards_path:
    value: $DATA_DIR/dclm_48B_tokenized
  token_budget:
    value: 10255073280 # intentionally training 10B total tokens only
    # value: 41020293120
    # we used 10255073280 for the 500M size, chinchilla scaling suggests 4x for 2B, then another 3.5x for 7B.
    #  token_budget := effective_bs * H * iterations
    #               =      2**22    * 30 * ___ <--degree of freedom when we set other params.
    #  note, effective_bz := mbs * workers * seqlen 
    #                      = 256 *    8    *  2048 = 2**22
    #  thus for 2B: H=30 num_steps = 41020293120/8/2048/256/30 = 326
    #               H=60 num_steps = 41020293120/8/2048/256/60 = 163
    #  and for 7B (4*7/2 * 10255073280 = 143571025920):
    #               H=30 num_steps = 143571025920/8/2048/256/30 = 1141
    #               H=60 num_steps = 143571025920/8/2048/256/60 = 571
    #               H=90 num_steps = 143571025920/8/2048/256/90 = 380   
  shard_token_size:
    value: 1073741824 # 1Gi (gibabytes i.e. 1Gi=2**30 bytes, slightly larger than 1GB which is 10**9 bytes)
  sequence_length:
    value: 2048

  # Model configuration
  hparams_file:
    value: hparams/7B/7B_model_hparams.json
  use_compile:
    value: False

  muonclip_threshold:
    values:
    - 30.0

  # Training configuration
  micro_batch_size:
    value: 4 # -1 to set micro_batch_size to batch_size
  batch_size:
    values: 
    - 256
  outer_learning_rate:
    values:
    - 1
  inner_learning_rate:
    values:
    - 0.02
    - 0.001
    - 0.0008
  # Muon-specific hyperparameters
  muon_adam_lr_scale:
    values:
    - 0.5
  muon_momentum:
    value: 0.95  # Muon momentum
  muon_weight_decay:
    values:
    - 0.01  # Original muon weight decay 
  inner_steps:
    values:
    - 30
  warmup_steps:
    value: 800
  # AdamW weight decay for embedding/head params
  weight_decay:
    values: 
    - 0.1  
  outer_nesterov:
    value: False

  # Compression configuration
  error_decay:
    value: 0.95
  top_k:
    values: 
    - 128
  chunk_size:
    value: 64
